
services:
  astro:
    image: node:22-alpine
    container_name: astro-portfolio-dev
    working_dir: /app

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "4321:4321"

    environment:
      - NODE_ENV=development

    # Le volume anonyme node_modules est créé par root : on le rend à `node`
    # (uid 1000), puis tout tourne sous cet utilisateur pour que les fichiers
    # générés (.astro/, dist/, lockfile) ne deviennent pas la propriété de root.
    command: >
      sh -c "chown node:node /app/node_modules &&
             su node -s /bin/sh -c 'npx -y pnpm@11 install && npx -y pnpm@11 dev --host'"

    stdin_open: true
    tty: true
