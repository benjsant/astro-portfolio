services:
  astro:
    image: node:22-alpine
    container_name: astro-portfolio-dev
    working_dir: /app

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "4321:4321"

    environment:
      - NODE_ENV=development

    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev -- --host"

    stdin_open: true
    tty: true
