services:
  astro:
    image: node:22-alpine
    container_name: astro-portfolio-dev
    working_dir: /app

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "4321:4321"

    environment:
      - NODE_ENV=development

    # Le volume anonyme node_modules est créé par root : on le rend à `node`
    # (uid 1000), puis tout tourne sous cet utilisateur pour que les fichiers
    # générés (.astro/, dist/, lockfile) ne deviennent pas la propriété de root.
    #
    # Au démarrage, on retire aussi :
    #   - .astro/dev.json : verrou laissé par un arrêt brutal (extinction du
    #     PC) qui bloque sinon `astro dev` (« Another astro dev server is
    #     already running ») ; le conteneur est seul à servir ce projet ;
    #   - les droits root sur node_modules/.vite : une commande lancée en root
    #     (`docker compose exec astro …` sans `-u node`) y crée des fichiers
    #     que Vite ne peut plus remplacer (EACCES).
    command: >
      sh -c "rm -f /app/.astro/dev.json &&
             chown node:node /app/node_modules &&
             mkdir -p /app/node_modules/.vite && chown -R node:node /app/node_modules/.vite &&
             su node -s /bin/sh -c 'npx -y pnpm@11 install && npx -y pnpm@11 dev --host'"

    stdin_open: true
    tty: true

  # Génération des PDF du CV (scripts/cv-pdf.mjs), à la demande :
  #   docker compose run --rm cv-pdf --private   -> out-private/ (avec CV_PHONE)
  #   docker compose run --rm cv-pdf --public    -> out-public/  (sans téléphone)
  # Image Playwright officielle (Chromium + polices) : le Chromium de
  # Playwright ne tourne pas sur Alpine. Sa version DOIT correspondre à celle
  # de `playwright` dans package.json. Profil `cv` : ne démarre pas avec
  # `docker compose up`.
  cv-pdf:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["cv"]
    working_dir: /app
    volumes:
      - .:/app
      # node_modules Linux/glibc propres à ce conteneur (pas ceux de l'hôte).
      - cv_pdf_node_modules:/app/node_modules
    # Même principe que `astro` : volume rendu à l'uid 1000 (ubuntu), puis
    # tout tourne sous cet utilisateur (PDF générés à ton nom, pas root).
    entrypoint:
      - sh
      - -c
      - >
        chown 1000:1000 /app/node_modules &&
        exec setpriv --reuid=1000 --regid=1000 --init-groups env HOME=/tmp
        sh -c 'npx -y pnpm@11 install --frozen-lockfile --reporter=silent &&
        node scripts/cv-pdf.mjs "$$@"' sh "$$@"
      - sh
    command: ["--public"]

volumes:
  cv_pdf_node_modules:
