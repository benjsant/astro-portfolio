<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1219"/>
      <stop offset="0.55" stop-color="#0c1c25"/>
      <stop offset="1" stop-color="#081715"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2dd4bf" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="600" cy="270" r="430" fill="url(#glow)"/>

  <!-- Coins -->
  <g stroke="#2dd4bf" stroke-width="2" fill="none" stroke-opacity="0.5">
    <path d="M 44 78 L 44 44 L 78 44"/>
    <path d="M 1156 44 L 1156 44 L 1156 78 M 1122 44 L 1156 44"/>
    <path d="M 44 552 L 44 586 L 78 586"/>
    <path d="M 1122 586 L 1156 586 L 1156 552"/>
  </g>

  <!-- Motif agent LLM (logo) -->
  <g stroke="url(#node)" stroke-width="2" stroke-opacity="0.55">
    <line x1="600" y1="150" x2="652" y2="150"/>
    <line x1="600" y1="150" x2="626" y2="195"/>
    <line x1="600" y1="150" x2="574" y2="195"/>
    <line x1="600" y1="150" x2="548" y2="150"/>
    <line x1="600" y1="150" x2="574" y2="105"/>
    <line x1="600" y1="150" x2="626" y2="105"/>
  </g>
  <g fill="#0a1219" stroke="#5eead4" stroke-width="2.5">
    <circle cx="652" cy="150" r="7"/>
    <circle cx="626" cy="195" r="7"/>
    <circle cx="574" cy="195" r="7"/>
    <circle cx="548" cy="150" r="7"/>
    <circle cx="574" cy="105" r="7"/>
    <circle cx="626" cy="105" r="7"/>
  </g>
  <circle cx="600" cy="150" r="24" fill="url(#node)"/>
  <text x="600" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#06231f">LLM</text>

  <!-- Texte centré -->
  <text x="600" y="268" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="5" fill="#2dd4bf">DÉVELOPPEUR IA · DATA ENGINEERING</text>
  <text x="600" y="372" text-anchor="middle" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-1">Benjamin Santrisse</text>
  <line x1="430" y1="410" x2="770" y2="410" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="600" y="462" text-anchor="middle" font-size="30" fill="#cbd5e1">Agents LLM · Pipelines MLOps · ETL &amp; APIs déployés</text>

  <!-- Pill URL -->
  <rect x="418" y="516" width="364" height="48" rx="24" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="600" y="547" text-anchor="middle" font-size="23" font-weight="600" fill="#5eead4" letter-spacing="0.5">benjamin-santrisse.vercel.app</text>
</svg>
