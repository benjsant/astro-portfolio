allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

# Correctifs de sécurité pour des dépendances transitives de build
# (@astrojs/vercel > @vercel/nft, astro > unstorage > @netlify/blobs) que les
# paquets amont n'ont pas encore remontées. Chaque règle ne vise que les
# versions vulnérables et reste dans la même version majeure.
overrides:
  'tar@>=7 <7.5.21': '^7.5.21'
  'brace-expansion@>=5 <5.0.12': '^5.0.12'
  '@fastify/busboy@>=3 <3.2.2': '^3.2.2'
  'image-size@>=2 <2.0.3': '^2.0.3'
  'path-to-regexp@>=6 <6.3.0': '^6.3.0'
  'source-map-js@>=1 <1.2.2': '^1.2.2'
  'tmp@<0.2.6': '^0.2.6'
  '@opentelemetry/core@>=2 <2.8.0': '^2.8.0'
