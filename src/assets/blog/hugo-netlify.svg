<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .w-bg     { fill: oklch(58% 0.135 65); }
    .w-ico    { stroke: oklch(97% 0.025 85); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .w-txt    { fill: oklch(97% 0.025 85); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .w-sub    { fill: oklch(89% 0.075 80); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.9; }
    .w-mono   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .w-ln     { stroke: oklch(80% 0.115 75); stroke-width: 1; stroke-opacity: 0.3; }
    .w-pil    { fill: oklch(50% 0.125 60); fill-opacity: 0.5; stroke: oklch(89% 0.075 80); stroke-opacity: 0.6; stroke-width: 1; }
    .w-ptx    { fill: oklch(95% 0.04 80); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .w-cor    { stroke: oklch(80% 0.115 75); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .w-card        { fill: oklch(50% 0.125 60); fill-opacity: 0.25; stroke: oklch(89% 0.075 80); stroke-opacity: 0.35; stroke-width: 1; }
    .w-card-text   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.75; }
    .w-stage       { fill: oklch(50% 0.125 60); fill-opacity: 0.4; stroke: oklch(97% 0.025 85); stroke-opacity: 0.85; stroke-width: 2; }
    .w-stage-strong { fill: oklch(50% 0.125 60); fill-opacity: 0.55; stroke: oklch(97% 0.025 85); stroke-opacity: 0.95; stroke-width: 2.2; }
    .w-stage-label { fill: oklch(97% 0.025 85); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .w-stage-sub   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; fill-opacity: 0.7; }
    .w-arrow       { stroke: oklch(97% 0.025 85); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.85; }
    .w-flow        { stroke: oklch(89% 0.075 80); stroke-width: 2; fill: none; stroke-opacity: 0.55; stroke-dasharray: 4 6; }
    .w-dot         { fill: oklch(85% 0.135 75); }
  </style>

  <rect width="1200" height="630" class="w-bg"/>

  <g class="w-ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Left: markdown files (content) -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-size="11" class="w-mono" letter-spacing="1" fill-opacity="0.6">CONTENT</text>
    <g transform="translate(0, 14)">
      <rect width="180" height="32" rx="6" class="w-card"/>
      <g transform="translate(14, 8)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="1.4">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
      </g>
      <text x="44" y="20" font-size="11" class="w-card-text" letter-spacing="0.5">hello-world.md</text>
    </g>
    <g transform="translate(0, 52)">
      <rect width="180" height="32" rx="6" class="w-card"/>
      <g transform="translate(14, 8)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="1.4">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
      </g>
      <text x="44" y="20" font-size="11" class="w-card-text" letter-spacing="0.5">hugo-netlify.md</text>
    </g>
    <g transform="translate(0, 90)">
      <rect width="180" height="32" rx="6" class="w-card"/>
      <g transform="translate(14, 8)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="1.4">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
      </g>
      <text x="44" y="20" font-size="11" class="w-card-text" letter-spacing="0.5">about.md</text>
    </g>
    <g transform="translate(0, 128)">
      <rect width="180" height="32" rx="6" class="w-card"/>
      <text x="14" y="20" font-size="11" class="w-card-text" letter-spacing="0.5" fill-opacity="0.5">+ 12 articles...</text>
    </g>
  </g>

  <!-- Right: deployed URLs -->
  <g transform="translate(960, 175)">
    <text x="0" y="0" font-size="11" class="w-mono" letter-spacing="1" fill-opacity="0.6">DEPLOYED</text>
    <g transform="translate(0, 14)"><rect width="180" height="32" rx="6" class="w-card"/><circle cx="14" cy="16" r="4" fill="oklch(97% 0.025 85)" fill-opacity="0.85"/><text x="28" y="20" font-size="11" class="w-card-text" letter-spacing="0.5">www.site.com</text></g>
    <g transform="translate(0, 52)"><rect width="180" height="32" rx="6" class="w-card"/><circle cx="14" cy="16" r="4" fill="oklch(97% 0.025 85)" fill-opacity="0.6"/><text x="28" y="20" font-size="11" class="w-card-text" letter-spacing="0.5">CDN · 32 edges</text></g>
    <g transform="translate(0, 90)"><rect width="180" height="32" rx="6" class="w-card"/><circle cx="14" cy="16" r="4" fill="oklch(97% 0.025 85)" fill-opacity="0.5"/><text x="28" y="20" font-size="11" class="w-card-text" letter-spacing="0.5">build · 0.8s</text></g>
  </g>

  <!-- Center: pipeline Hugo → git push → Netlify → web -->
  <g transform="translate(300, 195)">

    <!-- Hugo source -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="110" rx="12" class="w-stage"/>
      <g transform="translate(45, 18)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="2">
        <!-- lightning bolt -->
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
      </g>
      <text x="65" y="78" font-size="14" text-anchor="middle" class="w-stage-label" letter-spacing="1">Hugo</text>
      <text x="65" y="95" font-size="10" text-anchor="middle" class="w-stage-sub" letter-spacing="1">SSG · Go</text>
    </g>

    <!-- Arrow with "git push" label -->
    <path d="M 138 55 L 215 55 M 210 50 L 215 55 L 210 60" class="w-arrow"/>
    <text x="176" y="40" font-size="11" text-anchor="middle" class="w-mono" letter-spacing="1.5" fill-opacity="0.85">git push</text>

    <!-- Build / Deploy (highlighted) -->
    <g transform="translate(220, -10)">
      <rect x="0" y="0" width="160" height="130" rx="12" class="w-stage-strong"/>
      <g transform="translate(64, 26)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="2">
        <!-- cloud upload -->
        <path d="M16 16l-4-4-4 4"/>
        <path d="M12 12v9"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </g>
      <text x="80" y="88" font-size="14" text-anchor="middle" class="w-stage-label" letter-spacing="1.5">Netlify</text>
      <text x="80" y="105" font-size="10" text-anchor="middle" class="w-stage-sub" letter-spacing="1">build · deploy</text>
    </g>

    <!-- Arrow with "CDN" label -->
    <path d="M 388 55 L 465 55 M 460 50 L 465 55 L 460 60" class="w-arrow"/>
    <text x="426" y="40" font-size="11" text-anchor="middle" class="w-mono" letter-spacing="1.5" fill-opacity="0.85">CDN</text>

    <!-- Web globe -->
    <g transform="translate(470, 0)">
      <rect x="0" y="0" width="130" height="110" rx="12" class="w-stage"/>
      <g transform="translate(45, 18)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="2">
        <!-- globe -->
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>
      </g>
      <text x="65" y="78" font-size="14" text-anchor="middle" class="w-stage-label" letter-spacing="1">Web</text>
      <text x="65" y="95" font-size="10" text-anchor="middle" class="w-stage-sub" letter-spacing="1">static · fast</text>
    </g>

  </g>

  <g transform="translate(0, 410)">
    <g transform="translate(450, 0)"><rect width="80" height="32" rx="16" class="w-pil"/><text x="40" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">HUGO</text></g>
    <g transform="translate(545, 0)"><rect width="100" height="32" rx="16" class="w-pil"/><text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">NETLIFY</text></g>
    <g transform="translate(660, 0)"><rect width="100" height="32" rx="16" class="w-pil"/><text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">STATIC</text></g>
  </g>

  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="w-txt">Hugo + Netlify</text>

  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="w-mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="w-sub">CRÉER SON BLOG TECHNIQUE</tspan>
      <tspan class="w-mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="w-sub" dx="18">GUIDE</tspan>
    </text>
  </g>

  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="w-dot"/>
    <text x="14" y="5" font-size="14" class="w-mono" letter-spacing="2">GUIDE · WEB</text>
  </g>

  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="w-dot"/>
    <circle cx="14" cy="0" r="4" class="w-dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="w-dot" fill-opacity="0.3"/>
  </g>

  <path d="M 36 60 L 36 36 L 60 36" class="w-cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="w-cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="w-cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="w-cor"/>
</svg>
