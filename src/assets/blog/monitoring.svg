<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .panel  { fill: var(--brand-400); fill-opacity: 0.22; stroke: var(--brand-100); stroke-opacity: 0.7; stroke-width: 2; }
    .panel-bar { fill: var(--brand-400); fill-opacity: 0.45; }
    .panel-label { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.85; }
    .panel-value { fill: var(--brand-50); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .axis  { stroke: var(--brand-200); stroke-width: 1; stroke-opacity: 0.3; }
    .line-chart { stroke: var(--brand-50); stroke-width: 2; fill: none; stroke-opacity: 0.95; stroke-linejoin: round; stroke-linecap: round; }
    .line-chart-fill { fill: var(--brand-100); fill-opacity: 0.18; }
    .bar-chart { fill: var(--brand-100); fill-opacity: 0.85; }
    .scatter { fill: var(--brand-50); fill-opacity: 0.9; }
    .scatter-faint { fill: var(--brand-100); fill-opacity: 0.5; }
    .metric-card { fill: var(--brand-400); fill-opacity: 0.22; stroke: var(--brand-100); stroke-opacity: 0.55; stroke-width: 1.5; }
    .alert-pulse { fill: var(--brand-50); }
    .dot    { fill: var(--brand-200); }
  </style>

  <rect width="1200" height="630" class="bg"/>

  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Left side: small metric cards (KPI tiles) -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.55">METRICS</text>
    <g transform="translate(0, 14)">
      <rect width="200" height="46" rx="8" class="metric-card"/>
      <text x="12" y="18" font-size="10" class="panel-label" letter-spacing="1.5">REQUESTS / SEC</text>
      <text x="12" y="38" font-size="16" class="panel-value">128</text>
      <g transform="translate(110, 14)">
        <polyline points="0,18 10,15 20,12 30,8 40,10 50,5 60,6 70,4" class="line-chart" stroke-width="1.5"/>
      </g>
    </g>
    <g transform="translate(0, 70)">
      <rect width="200" height="46" rx="8" class="metric-card"/>
      <text x="12" y="18" font-size="10" class="panel-label" letter-spacing="1.5">P95 LATENCY</text>
      <text x="12" y="38" font-size="16" class="panel-value">240ms</text>
      <g transform="translate(110, 14)">
        <polyline points="0,12 10,14 20,10 30,15 40,8 50,11 60,9 70,7" class="line-chart" stroke-width="1.5"/>
      </g>
    </g>
    <g transform="translate(0, 126)">
      <rect width="200" height="46" rx="8" class="metric-card"/>
      <text x="12" y="18" font-size="10" class="panel-label" letter-spacing="1.5">CACHE HIT RATE</text>
      <text x="12" y="38" font-size="16" class="panel-value">82%</text>
      <g transform="translate(110, 22)">
        <circle cx="0" cy="0" r="6" class="alert-pulse" fill-opacity="0.9"/>
        <circle cx="0" cy="0" r="10" class="alert-pulse" fill-opacity="0.25"/>
      </g>
    </g>
  </g>

  <!-- Right side: small log/alert badges -->
  <g transform="translate(945, 175)">
    <text x="0" y="0" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.55">LOKI · ALERTS</text>
    <g transform="translate(0, 14)">
      <rect width="200" height="36" rx="8" class="metric-card"/>
      <circle cx="14" cy="18" r="4" class="alert-pulse" fill-opacity="0.95"/>
      <text x="28" y="22" font-size="11" class="panel-label" letter-spacing="1">200 · /api/predict</text>
    </g>
    <g transform="translate(0, 60)">
      <rect width="200" height="36" rx="8" class="metric-card"/>
      <circle cx="14" cy="18" r="4" class="alert-pulse" fill-opacity="0.6"/>
      <text x="28" y="22" font-size="11" class="panel-label" letter-spacing="1">200 · /api/tags</text>
    </g>
    <g transform="translate(0, 106)">
      <rect width="200" height="36" rx="8" class="metric-card"/>
      <circle cx="14" cy="18" r="4" class="alert-pulse" fill-opacity="0.4"/>
      <text x="28" y="22" font-size="11" class="panel-label" letter-spacing="1">500 · /api/llm</text>
    </g>
  </g>

  <!-- Central dashboard panel -->
  <g transform="translate(300, 160)">
    <!-- Panel frame -->
    <rect x="0" y="0" width="600" height="240" rx="14" class="panel"/>
    <!-- Top bar -->
    <rect x="0" y="0" width="600" height="34" rx="14" class="panel-bar"/>
    <rect x="0" y="22" width="600" height="12" class="panel-bar"/>
    <circle cx="18" cy="17" r="5" class="alert-pulse" fill-opacity="0.85"/>
    <circle cx="36" cy="17" r="5" class="alert-pulse" fill-opacity="0.55"/>
    <circle cx="54" cy="17" r="5" class="alert-pulse" fill-opacity="0.3"/>
    <text x="300" y="22" font-size="12" text-anchor="middle" class="panel-label" letter-spacing="2">grafana · fastapi-monitoring</text>

    <!-- Big line chart -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-size="11" class="panel-label" letter-spacing="1">http_request_duration_seconds · p95</text>
      <!-- Axis -->
      <line x1="0" y1="125" x2="340" y2="125" class="axis"/>
      <line x1="0" y1="20" x2="0" y2="125" class="axis"/>
      <!-- Grid lines -->
      <line x1="0" y1="50" x2="340" y2="50" class="axis" stroke-dasharray="3 5"/>
      <line x1="0" y1="80" x2="340" y2="80" class="axis" stroke-dasharray="3 5"/>
      <!-- Fill under curve -->
      <path d="M 0 110 L 20 95 L 40 100 L 60 85 L 80 90 L 100 70 L 120 75 L 140 60 L 160 65 L 180 50 L 200 55 L 220 45 L 240 60 L 260 40 L 280 50 L 300 35 L 320 40 L 340 30 L 340 125 L 0 125 Z" class="line-chart-fill"/>
      <!-- Line -->
      <path d="M 0 110 L 20 95 L 40 100 L 60 85 L 80 90 L 100 70 L 120 75 L 140 60 L 160 65 L 180 50 L 200 55 L 220 45 L 240 60 L 260 40 L 280 50 L 300 35 L 320 40 L 340 30" class="line-chart"/>
      <!-- End marker -->
      <circle cx="340" cy="30" r="4" class="scatter"/>
    </g>

    <!-- Bar chart on the right -->
    <g transform="translate(400, 60)">
      <text x="0" y="0" font-size="11" class="panel-label" letter-spacing="1">tool_calls · 24h</text>
      <line x1="0" y1="125" x2="170" y2="125" class="axis"/>
      <rect x="6"   y="80"  width="14" height="45" rx="2" class="bar-chart"/>
      <rect x="26"  y="60"  width="14" height="65" rx="2" class="bar-chart"/>
      <rect x="46"  y="100" width="14" height="25" rx="2" class="bar-chart"/>
      <rect x="66"  y="40"  width="14" height="85" rx="2" class="bar-chart"/>
      <rect x="86"  y="55"  width="14" height="70" rx="2" class="bar-chart"/>
      <rect x="106" y="30"  width="14" height="95" rx="2" class="bar-chart"/>
      <rect x="126" y="65"  width="14" height="60" rx="2" class="bar-chart"/>
      <rect x="146" y="85"  width="14" height="40" rx="2" class="bar-chart"/>
    </g>
  </g>

  <g transform="translate(0, 410)">
    <g transform="translate(420, 0)"><rect width="120" height="32" rx="16" class="pil"/><text x="60" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">PROMETHEUS</text></g>
    <g transform="translate(555, 0)"><rect width="100" height="32" rx="16" class="pil"/><text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">GRAFANA</text></g>
    <g transform="translate(670, 0)"><rect width="70" height="32" rx="16" class="pil"/><text x="35" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">LOKI</text></g>
  </g>

  <text x="600" y="490" font-size="86" text-anchor="middle" letter-spacing="-3" class="txt">Monitoring FastAPI</text>

  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="sub">MÉTRIQUES · LOGS · ALERTES</tspan>
      <tspan class="mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="sub" dx="18">OBSERVABILITÉ</tspan>
    </text>
  </g>

  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">ARTICLE · OBSERVABILITÉ</text>
  </g>

  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
