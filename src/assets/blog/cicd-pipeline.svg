<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .stage  { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-100); stroke-opacity: 0.85; stroke-width: 2; }
    .stage-label { fill: var(--brand-50); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .check-circle { fill: var(--brand-100); fill-opacity: 0.95; }
    .check-mark   { stroke: var(--brand-500); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .pipe   { stroke: var(--brand-50); stroke-width: 3; fill: none; stroke-opacity: 0.75; }
    .pipe-flow { stroke: var(--brand-100); stroke-width: 2; fill: none; stroke-opacity: 0.6; stroke-dasharray: 4 6; }
    .commit-dot { fill: var(--brand-100); }
    .branch-line { stroke: var(--brand-100); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .tag-badge { fill: var(--brand-400); fill-opacity: 0.45; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Dotted grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Background commit history (left) -->
  <g transform="translate(70, 180)">
    <text x="0" y="0" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.55">GIT HISTORY</text>
    <line x1="6" y1="14" x2="6" y2="150" class="branch-line"/>
    <circle cx="6" cy="22" r="5" class="commit-dot" fill-opacity="0.85"/>
    <text x="20" y="26" font-size="11" class="mono" fill-opacity="0.55">feat: pipeline</text>
    <circle cx="6" cy="50" r="5" class="commit-dot" fill-opacity="0.7"/>
    <text x="20" y="54" font-size="11" class="mono" fill-opacity="0.55">fix: lint</text>
    <circle cx="6" cy="78" r="5" class="commit-dot" fill-opacity="0.55"/>
    <text x="20" y="82" font-size="11" class="mono" fill-opacity="0.55">chore: docker</text>
    <circle cx="6" cy="106" r="5" class="commit-dot" fill-opacity="0.4"/>
    <text x="20" y="110" font-size="11" class="mono" fill-opacity="0.55">test: schemas</text>
    <circle cx="6" cy="134" r="5" class="commit-dot" fill-opacity="0.3"/>
    <text x="20" y="138" font-size="11" class="mono" fill-opacity="0.55">init</text>
  </g>

  <!-- Background semantic version tags (right) -->
  <g transform="translate(990, 180)">
    <text x="0" y="0" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.55">TAGS</text>
    <g transform="translate(0, 14)">
      <rect width="64" height="22" rx="11" class="tag-badge"/>
      <text x="32" y="15" font-size="11" text-anchor="middle" class="mono">v1.2.0</text>
    </g>
    <g transform="translate(0, 44)">
      <rect width="64" height="22" rx="11" class="tag-badge"/>
      <text x="32" y="15" font-size="11" text-anchor="middle" class="mono">v1.1.3</text>
    </g>
    <g transform="translate(0, 74)">
      <rect width="64" height="22" rx="11" class="tag-badge"/>
      <text x="32" y="15" font-size="11" text-anchor="middle" class="mono">v1.1.0</text>
    </g>
    <g transform="translate(0, 104)">
      <rect width="64" height="22" rx="11" class="tag-badge"/>
      <text x="32" y="15" font-size="11" text-anchor="middle" class="mono">v1.0.0</text>
    </g>
  </g>

  <!-- Center: horizontal pipeline (5 stages) -->
  <g transform="translate(280, 230)">

    <!-- Pipe line connecting stages -->
    <line x1="55" y1="55" x2="585" y2="55" class="pipe"/>
    <line x1="55" y1="55" x2="585" y2="55" class="pipe-flow"/>

    <!-- Stage 1: LINT -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="110" height="110" rx="12" class="stage"/>
      <circle cx="55" cy="42" r="16" class="check-circle"/>
      <path d="M 48 42 L 53 47 L 62 38" class="check-mark"/>
      <text x="55" y="86" font-size="13" text-anchor="middle" class="stage-label" letter-spacing="1">LINT</text>
    </g>

    <!-- Stage 2: TEST -->
    <g transform="translate(135, 0)">
      <rect x="0" y="0" width="110" height="110" rx="12" class="stage"/>
      <circle cx="55" cy="42" r="16" class="check-circle"/>
      <path d="M 48 42 L 53 47 L 62 38" class="check-mark"/>
      <text x="55" y="86" font-size="13" text-anchor="middle" class="stage-label" letter-spacing="1">TEST</text>
    </g>

    <!-- Stage 3: BUILD -->
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="110" height="110" rx="12" class="stage"/>
      <circle cx="55" cy="42" r="16" class="check-circle"/>
      <path d="M 48 42 L 53 47 L 62 38" class="check-mark"/>
      <text x="55" y="86" font-size="13" text-anchor="middle" class="stage-label" letter-spacing="1">BUILD</text>
    </g>

    <!-- Stage 4: PUSH -->
    <g transform="translate(405, 0)">
      <rect x="0" y="0" width="110" height="110" rx="12" class="stage"/>
      <circle cx="55" cy="42" r="16" class="check-circle"/>
      <path d="M 48 42 L 53 47 L 62 38" class="check-mark"/>
      <text x="55" y="86" font-size="13" text-anchor="middle" class="stage-label" letter-spacing="1">PUSH</text>
    </g>

    <!-- Stage 5: TAG -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="110" height="110" rx="12" class="stage"/>
      <circle cx="55" cy="42" r="16" class="check-circle"/>
      <path d="M 48 42 L 53 47 L 62 38" class="check-mark"/>
      <text x="55" y="86" font-size="13" text-anchor="middle" class="stage-label" letter-spacing="1">TAG</text>
    </g>

  </g>

  <!-- Tag pills -->
  <g transform="translate(0, 410)">
    <g transform="translate(420, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">CI/CD</text>
    </g>
    <g transform="translate(535, 0)">
      <rect width="130" height="32" rx="16" class="pil"/>
      <text x="65" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">GITHUB ACTIONS</text>
    </g>
    <g transform="translate(680, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">DOCKER</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="txt">CI/CD MLOps</text>

  <!-- Subtitle -->
  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="sub">PIPELINE D'INTÉGRATION CONTINUE</tspan>
      <tspan class="mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="sub" dx="18">SEMANTIC RELEASE</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · MLOPS</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
