<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .wave   { stroke: var(--brand-100); stroke-width: 2; fill: none; stroke-opacity: 0.45; stroke-linecap: round; }
    .wave-faint { stroke: var(--brand-200); stroke-width: 1.5; fill: none; stroke-opacity: 0.22; stroke-linecap: round; }
    .vinyl-outer { stroke: var(--brand-50); stroke-width: 5; fill: var(--brand-400); fill-opacity: 0.18; }
    .vinyl-mid   { stroke: var(--brand-100); stroke-width: 1.2; fill: none; stroke-opacity: 0.45; }
    .vinyl-label { fill: var(--brand-500); stroke: var(--brand-50); stroke-width: 4; }
    .vinyl-hole  { fill: var(--brand-50); }
    .eq-bar { fill: var(--brand-50); }
    .note   { fill: var(--brand-100); fill-opacity: 0.3; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Dotted grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Background waveform (full-width sine wave through the middle) -->
  <path
    d="M 0 270 Q 50 240 100 270 T 200 270 T 300 270 T 400 270 T 500 270 T 600 270 T 700 270 T 800 270 T 900 270 T 1000 270 T 1100 270 T 1200 270"
    class="wave-faint"/>
  <path
    d="M 0 270 Q 50 290 100 270 T 200 270 T 300 270 T 400 270 T 500 270 T 600 270 T 700 270 T 800 270 T 900 270 T 1000 270 T 1100 270 T 1200 270"
    class="wave-faint"/>

  <!-- Left equalizer bars (data-viz feel) -->
  <g transform="translate(60, 200)">
    <rect x="0"   y="80" width="6" height="40" rx="3" class="note" fill-opacity="0.45"/>
    <rect x="14"  y="55" width="6" height="65" rx="3" class="note" fill-opacity="0.45"/>
    <rect x="28"  y="20" width="6" height="100" rx="3" class="note" fill-opacity="0.55"/>
    <rect x="42"  y="40" width="6" height="80" rx="3" class="note" fill-opacity="0.45"/>
    <rect x="56"  y="70" width="6" height="50" rx="3" class="note" fill-opacity="0.4"/>
    <rect x="70"  y="35" width="6" height="85" rx="3" class="note" fill-opacity="0.5"/>
    <rect x="84"  y="60" width="6" height="60" rx="3" class="note" fill-opacity="0.45"/>
    <rect x="98"  y="78" width="6" height="42" rx="3" class="note" fill-opacity="0.4"/>
    <text x="0" y="145" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.5">SPECTRUM</text>
  </g>

  <!-- Right equalizer bars -->
  <g transform="translate(1040, 200)">
    <rect x="0"   y="60" width="6" height="60" rx="3" class="note" fill-opacity="0.45"/>
    <rect x="14"  y="30" width="6" height="90" rx="3" class="note" fill-opacity="0.5"/>
    <rect x="28"  y="50" width="6" height="70" rx="3" class="note" fill-opacity="0.45"/>
    <rect x="42"  y="15" width="6" height="105" rx="3" class="note" fill-opacity="0.55"/>
    <rect x="56"  y="45" width="6" height="75" rx="3" class="note" fill-opacity="0.5"/>
    <rect x="70"  y="68" width="6" height="52" rx="3" class="note" fill-opacity="0.4"/>
    <rect x="84"  y="38" width="6" height="82" rx="3" class="note" fill-opacity="0.5"/>
    <rect x="98"  y="72" width="6" height="48" rx="3" class="note" fill-opacity="0.4"/>
    <text x="0" y="145" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.5">TAGS</text>
  </g>

  <!-- Music notes scattered in background -->
  <g class="note">
    <g transform="translate(230, 150)">
      <ellipse cx="0" cy="14" rx="6" ry="4.5"/>
      <rect x="5" y="-8" width="1.6" height="22" rx="0.8"/>
      <path d="M 6.6 -8 Q 14 -6 12 2 L 12 2 Q 12 -4 6.6 -3 Z"/>
    </g>
    <g transform="translate(940, 150)">
      <ellipse cx="0" cy="14" rx="6" ry="4.5"/>
      <rect x="5" y="-8" width="1.6" height="22" rx="0.8"/>
      <path d="M 6.6 -8 Q 14 -6 12 2 L 12 2 Q 12 -4 6.6 -3 Z"/>
    </g>
    <g transform="translate(285, 380)" opacity="0.7">
      <ellipse cx="0" cy="10" rx="5" ry="3.8"/>
      <rect x="4.2" y="-6" width="1.4" height="16" rx="0.7"/>
    </g>
    <g transform="translate(900, 380)" opacity="0.7">
      <ellipse cx="0" cy="10" rx="5" ry="3.8"/>
      <rect x="4.2" y="-6" width="1.4" height="16" rx="0.7"/>
    </g>
  </g>

  <!-- Center vinyl-style logo with equalizer inscribed in the label -->
  <g transform="translate(600, 240)">
    <!-- Outer vinyl -->
    <circle cx="0" cy="0" r="100" class="vinyl-outer"/>
    <!-- Grooves -->
    <circle cx="0" cy="0" r="85" class="vinyl-mid"/>
    <circle cx="0" cy="0" r="72" class="vinyl-mid"/>
    <circle cx="0" cy="0" r="60" class="vinyl-mid"/>
    <!-- Label (center) -->
    <circle cx="0" cy="0" r="42" class="vinyl-label"/>
    <!-- Equalizer bars inside the label -->
    <g class="eq-bar">
      <rect x="-22" y="-8"  width="5" height="16" rx="2"/>
      <rect x="-13" y="-14" width="5" height="28" rx="2"/>
      <rect x="-4"  y="-20" width="5" height="40" rx="2"/>
      <rect x="5"   y="-12" width="5" height="24" rx="2"/>
      <rect x="14"  y="-6"  width="5" height="12" rx="2"/>
    </g>
  </g>

  <!-- Tag pills -->
  <g transform="translate(0, 380)">
    <g transform="translate(425, 0)">
      <rect width="110" height="32" rx="16" class="pil"/>
      <text x="55" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">AGENT IA</text>
    </g>
    <g transform="translate(550, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">MUSIQUE</text>
    </g>
    <g transform="translate(665, 0)">
      <rect width="110" height="32" rx="16" class="pil"/>
      <text x="55" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">DEEPSEEK</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="475" font-size="92" text-anchor="middle" letter-spacing="-3" class="txt">Audiomancy</text>

  <!-- Subtitle bar -->
  <g transform="translate(600, 525)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="sub">GÉNÉRATION DE PLAYLISTS PAR AGENT</tspan>
      <tspan class="mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="sub" dx="18">REACT · JAMENDO</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · IA</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
