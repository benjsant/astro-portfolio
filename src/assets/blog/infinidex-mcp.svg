<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .node   { fill: var(--brand-400); fill-opacity: 0.16; stroke: var(--brand-50); stroke-width: 2.5; }
    .card-dot { fill: var(--brand-100); fill-opacity: 0.35; }
    .edge   { stroke: var(--brand-50); stroke-width: 2.5; stroke-linecap: round; fill: none; stroke-opacity: 0.75; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Faint framing grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Pont MCP : client  →  serveur MCP  →  API/DB -->
  <g>
    <!-- Edges -->
    <path class="edge" d="M 396 235 h 92"/>
    <path class="edge" d="M 712 235 h 92"/>
    <!-- Arrowheads -->
    <path class="ico" d="M 484 227 l 9 8 l -9 8"/>
    <path class="ico" d="M 800 227 l 9 8 l -9 8"/>

    <!-- Node 1 : client MCP -->
    <g transform="translate(320, 235)">
      <rect x="-76" y="-46" width="152" height="92" rx="12" class="node"/>
      <rect x="-56" y="-26" width="112" height="8" rx="4" class="card-dot"/>
      <rect x="-56" y="-8" width="84" height="6" rx="3" class="card-dot"/>
      <rect x="-56" y="6" width="96" height="6" rx="3" class="card-dot"/>
      <text x="0" y="34" font-size="12" text-anchor="middle" class="mono" fill-opacity="0.6">CLIENT MCP</text>
    </g>

    <!-- Node 2 : serveur MCP (au centre, accentué) -->
    <g transform="translate(600, 235)">
      <rect x="-58" y="-58" width="116" height="116" rx="14" class="node" fill-opacity="0.26"/>
      <!-- glyphe connecteur -->
      <circle cx="0" cy="-8" r="16" class="ico"/>
      <path d="M0 8 v22" class="ico"/>
      <path d="M-16 -8 h-10 M16 -8 h10" class="ico"/>
      <circle cx="0" cy="-8" r="4" class="card-dot"/>
      <text x="0" y="46" font-size="12" text-anchor="middle" class="mono">MCP</text>
    </g>

    <!-- Node 3 : API + DB -->
    <g transform="translate(880, 235)">
      <rect x="-76" y="-46" width="152" height="92" rx="12" class="node"/>
      <ellipse cx="0" cy="-18" rx="30" ry="9" class="ico"/>
      <path d="M-30 -18 v22 a30 9 0 0 0 60 0 v-22" class="ico"/>
      <path d="M-30 -7 a30 9 0 0 0 60 0" class="ico"/>
      <text x="0" y="36" font-size="12" text-anchor="middle" class="mono" fill-opacity="0.6">API · DB</text>
    </g>
  </g>

  <!-- Tag pills above title -->
  <g transform="translate(0, 380)">
    <g transform="translate(430, 0)">
      <rect width="80" height="32" rx="16" class="pil"/>
      <text x="40" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">MCP</text>
    </g>
    <g transform="translate(525, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">PYTHON</text>
    </g>
    <g transform="translate(640, 0)">
      <rect width="130" height="32" rx="16" class="pil"/>
      <text x="65" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">100% LOCAL</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="475" font-size="74" text-anchor="middle" letter-spacing="-2" class="txt">InfiniDex MCP</text>

  <!-- Stats bar -->
  <g transform="translate(600, 525)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2">
      <tspan class="mono">STDIO</tspan>
      <tspan class="sub" dx="6">/ HTTP</tspan>
      <tspan class="mono" dx="18">·</tspan>
      <tspan class="mono" dx="18">CLAUDE</tspan>
      <tspan class="sub" dx="6">/ CURSOR</tspan>
      <tspan class="mono" dx="18">·</tspan>
      <tspan class="mono" dx="18">DOCKER</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · MCP</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
