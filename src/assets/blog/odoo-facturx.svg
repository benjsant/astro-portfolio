<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .node   { fill: var(--brand-400); fill-opacity: 0.14; stroke: var(--brand-50); stroke-width: 2.5; }
    .card-dot { fill: var(--brand-100); fill-opacity: 0.4; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Faint framing grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Facture (PDF lisible) -->
  <g transform="translate(560, 235)">
    <rect x="-96" y="-126" width="172" height="244" rx="12" class="node"/>
    <!-- en-tete + euro -->
    <rect x="-74" y="-104" width="92" height="12" rx="3" class="card-dot"/>
    <text x="56" y="-90" font-size="30" text-anchor="middle" class="txt">€</text>
    <!-- lignes de facture -->
    <line x1="-74" y1="-70" x2="52" y2="-70" class="ln" stroke-opacity="0.6"/>
    <rect x="-74" y="-58" width="80" height="6" rx="3" class="card-dot"/>
    <rect x="30" y="-58" width="22" height="6" rx="3" class="card-dot"/>
    <rect x="-74" y="-42" width="70" height="6" rx="3" class="card-dot"/>
    <rect x="34" y="-42" width="18" height="6" rx="3" class="card-dot"/>
    <rect x="-74" y="-26" width="84" height="6" rx="3" class="card-dot"/>
    <rect x="28" y="-26" width="24" height="6" rx="3" class="card-dot"/>
    <!-- total (surligne) -->
    <line x1="-74" y1="-6" x2="52" y2="-6" class="ln" stroke-opacity="0.6"/>
    <rect x="-6" y="6" width="58" height="10" rx="4" class="card-dot" fill-opacity="0.7"/>
    <rect x="-74" y="8" width="34" height="6" rx="3" class="card-dot"/>
  </g>

  <!-- Puce XML CII embarquee (le hybride Factur-X) -->
  <g transform="translate(690, 300)">
    <rect x="-52" y="-34" width="104" height="68" rx="12" class="node" fill-opacity="0.28"/>
    <text x="0" y="4" font-size="26" text-anchor="middle" class="mono">&lt;/&gt;</text>
    <text x="0" y="24" font-size="11" text-anchor="middle" letter-spacing="1" class="mono" fill-opacity="0.7">XML CII</text>
  </g>

  <!-- Tag pills above title -->
  <g transform="translate(0, 380)">
    <g transform="translate(418, 0)">
      <rect width="90" height="32" rx="16" class="pil"/>
      <text x="45" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">ODOO</text>
    </g>
    <g transform="translate(523, 0)">
      <rect width="130" height="32" rx="16" class="pil"/>
      <text x="65" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">FACTUR-X</text>
    </g>
    <g transform="translate(668, 0)">
      <rect width="114" height="32" rx="16" class="pil"/>
      <text x="57" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">PDF/A-3</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="475" font-size="76" text-anchor="middle" letter-spacing="-2" class="txt">Odoo Factur-X</text>

  <!-- Stats bar -->
  <g transform="translate(600, 525)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2">
      <tspan class="mono">CII</tspan>
      <tspan class="sub" dx="6">EN3</tspan>
      <tspan class="mono" dx="18">·</tspan>
      <tspan class="mono" dx="18">XML</tspan>
      <tspan class="sub" dx="6">VALIDÉ</tspan>
      <tspan class="mono" dx="18">·</tspan>
      <tspan class="mono" dx="18">ODOO</tspan>
      <tspan class="sub" dx="6">18</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · ERP</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
