<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Warm amber palette (used for standalone guides not tied to a project) */
    .w-bg     { fill: oklch(58% 0.135 65); }
    .w-bg-2   { fill: oklch(50% 0.125 60); fill-opacity: 0.45; }
    .w-bg-3   { fill: oklch(50% 0.125 60); fill-opacity: 0.22; }
    .w-ico    { stroke: oklch(97% 0.025 85); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .w-txt    { fill: oklch(97% 0.025 85); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .w-sub    { fill: oklch(89% 0.075 80); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.9; }
    .w-mono   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .w-ln     { stroke: oklch(80% 0.115 75); stroke-width: 1; stroke-opacity: 0.3; }
    .w-pil    { fill: oklch(50% 0.125 60); fill-opacity: 0.5; stroke: oklch(89% 0.075 80); stroke-opacity: 0.6; stroke-width: 1; }
    .w-ptx    { fill: oklch(95% 0.04 80); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .w-cor    { stroke: oklch(80% 0.115 75); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .w-term-bg     { fill: oklch(50% 0.125 60); fill-opacity: 0.35; stroke: oklch(89% 0.075 80); stroke-opacity: 0.75; stroke-width: 2; }
    .w-term-bar    { fill: oklch(50% 0.125 60); fill-opacity: 0.55; }
    .w-term-line   { fill: oklch(97% 0.025 85); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; }
    .w-term-prompt { fill: oklch(85% 0.135 75); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .w-term-comment { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 400; fill-opacity: 0.65; }
    .w-term-dot    { fill: oklch(97% 0.025 85); }
    .w-card        { fill: oklch(50% 0.125 60); fill-opacity: 0.25; stroke: oklch(89% 0.075 80); stroke-opacity: 0.35; stroke-width: 1; }
    .w-card-text   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.75; }
    .w-dot         { fill: oklch(85% 0.135 75); }
  </style>

  <rect width="1200" height="630" class="w-bg"/>

  <g class="w-ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Left: gh subcommand chips -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-size="11" class="w-mono" letter-spacing="1" fill-opacity="0.6">gh COMMANDS</text>
    <g transform="translate(0, 14)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">gh pr create</text></g>
    <g transform="translate(0, 50)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">gh issue list</text></g>
    <g transform="translate(0, 86)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">gh workflow run</text></g>
    <g transform="translate(0, 122)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">gh repo clone</text></g>
  </g>

  <!-- Right: status badges -->
  <g transform="translate(960, 175)">
    <text x="0" y="0" font-size="11" class="w-mono" letter-spacing="1" fill-opacity="0.6">STATUS</text>
    <g transform="translate(0, 14)"><rect width="180" height="28" rx="6" class="w-card"/><circle cx="14" cy="14" r="4" class="w-term-dot" fill-opacity="0.9"/><text x="28" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">PR #42 · open</text></g>
    <g transform="translate(0, 50)"><rect width="180" height="28" rx="6" class="w-card"/><circle cx="14" cy="14" r="4" class="w-term-dot" fill-opacity="0.7"/><text x="28" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">CI · passing</text></g>
    <g transform="translate(0, 86)"><rect width="180" height="28" rx="6" class="w-card"/><circle cx="14" cy="14" r="4" class="w-term-dot" fill-opacity="0.5"/><text x="28" y="19" font-size="12" class="w-card-text" letter-spacing="0.5">3 reviews</text></g>
  </g>

  <!-- Center: terminal window -->
  <g transform="translate(330, 150)">
    <rect x="0" y="0" width="540" height="240" rx="12" class="w-term-bg"/>
    <rect x="0" y="0" width="540" height="32" rx="12" class="w-term-bar"/>
    <rect x="0" y="20" width="540" height="12" class="w-term-bar"/>
    <circle cx="18" cy="16" r="5" class="w-term-dot" fill-opacity="0.85"/>
    <circle cx="36" cy="16" r="5" class="w-term-dot" fill-opacity="0.6"/>
    <circle cx="54" cy="16" r="5" class="w-term-dot" fill-opacity="0.4"/>
    <text x="270" y="21" font-size="12" text-anchor="middle" class="w-card-text" letter-spacing="2">~/projects/portfolio</text>

    <g transform="translate(24, 64)">
      <text x="0" y="0" font-size="15" class="w-term-prompt">$</text>
      <text x="22" y="0" font-size="15" class="w-term-line">gh pr create --title "feat: bannières"</text>
    </g>
    <g transform="translate(24, 96)">
      <text x="0" y="0" font-size="13" class="w-term-comment">→ Creating pull request for main</text>
    </g>
    <g transform="translate(24, 122)">
      <text x="0" y="0" font-size="13" class="w-term-comment">→ https://github.com/benjsant/...</text>
    </g>
    <g transform="translate(24, 152)">
      <text x="0" y="0" font-size="15" class="w-term-prompt">$</text>
      <text x="22" y="0" font-size="15" class="w-term-line">gh pr view --web</text>
    </g>
    <g transform="translate(24, 184)">
      <text x="0" y="0" font-size="13" class="w-term-comment">→ Opening pull request in browser</text>
    </g>
    <g transform="translate(24, 212)">
      <text x="0" y="0" font-size="15" class="w-term-prompt">$</text>
      <text x="22" y="0" font-size="15" class="w-term-line">_</text>
      <rect x="34" y="-12" width="9" height="16" class="w-term-dot" fill-opacity="0.9"/>
    </g>
  </g>

  <g transform="translate(0, 410)">
    <g transform="translate(440, 0)"><rect width="100" height="32" rx="16" class="w-pil"/><text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">GITHUB</text></g>
    <g transform="translate(555, 0)"><rect width="70" height="32" rx="16" class="w-pil"/><text x="35" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">CLI</text></g>
    <g transform="translate(640, 0)"><rect width="120" height="32" rx="16" class="w-pil"/><text x="60" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">TERMINAL</text></g>
  </g>

  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="w-txt">gh · GitHub CLI</text>

  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="w-mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="w-sub">GITHUB SANS QUITTER LE TERMINAL</tspan>
      <tspan class="w-mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="w-sub" dx="18">GUIDE</tspan>
    </text>
  </g>

  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="w-dot"/>
    <text x="14" y="5" font-size="14" class="w-mono" letter-spacing="2">GUIDE · OUTILS</text>
  </g>

  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="w-dot"/>
    <circle cx="14" cy="0" r="4" class="w-dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="w-dot" fill-opacity="0.3"/>
  </g>

  <path d="M 36 60 L 36 36 L 60 36" class="w-cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="w-cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="w-cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="w-cor"/>
</svg>
