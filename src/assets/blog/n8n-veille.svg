<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .node-bg     { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-100); stroke-opacity: 0.85; stroke-width: 2; }
    .node-bg-strong { fill: var(--brand-400); fill-opacity: 0.45; stroke: var(--brand-50); stroke-opacity: 0.95; stroke-width: 2.2; }
    .node-label  { fill: var(--brand-50); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .node-sub    { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; fill-opacity: 0.7; }
    .conn        { stroke: var(--brand-50); stroke-width: 2.2; fill: none; stroke-opacity: 0.85; }
    .conn-dot    { fill: var(--brand-100); }
    .feed-chip   { fill: var(--brand-400); fill-opacity: 0.16; stroke: var(--brand-200); stroke-opacity: 0.3; stroke-width: 1; }
    .feed-text   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.65; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Dotted grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Background RSS feed chips (left) -->
  <g transform="translate(60, 175)">
    <rect width="180" height="32" rx="6" class="feed-chip"/>
    <circle cx="18" cy="16" r="4" fill="var(--brand-100)" fill-opacity="0.45"/>
    <text x="30" y="20" font-size="11" class="feed-text" letter-spacing="1">medium.com/topic/ai</text>
  </g>
  <g transform="translate(60, 215)">
    <rect width="180" height="32" rx="6" class="feed-chip"/>
    <circle cx="18" cy="16" r="4" fill="var(--brand-100)" fill-opacity="0.45"/>
    <text x="30" y="20" font-size="11" class="feed-text" letter-spacing="1">dev.to/feed</text>
  </g>
  <g transform="translate(60, 255)">
    <rect width="180" height="32" rx="6" class="feed-chip"/>
    <circle cx="18" cy="16" r="4" fill="var(--brand-100)" fill-opacity="0.45"/>
    <text x="30" y="20" font-size="11" class="feed-text" letter-spacing="1">towardsdatascience</text>
  </g>
  <g transform="translate(60, 295)">
    <rect width="180" height="32" rx="6" class="feed-chip"/>
    <circle cx="18" cy="16" r="4" fill="var(--brand-100)" fill-opacity="0.45"/>
    <text x="30" y="20" font-size="11" class="feed-text" letter-spacing="1">thebatch</text>
  </g>

  <!-- Background Discord/output chips (right) -->
  <g transform="translate(960, 200)">
    <rect width="180" height="32" rx="6" class="feed-chip"/>
    <circle cx="18" cy="16" r="4" fill="var(--brand-100)" fill-opacity="0.45"/>
    <text x="30" y="20" font-size="11" class="feed-text" letter-spacing="1">discord webhook</text>
  </g>
  <g transform="translate(960, 240)">
    <rect width="180" height="32" rx="6" class="feed-chip"/>
    <circle cx="18" cy="16" r="4" fill="var(--brand-100)" fill-opacity="0.45"/>
    <text x="30" y="20" font-size="11" class="feed-text" letter-spacing="1">cron · 24h</text>
  </g>

  <!-- Connection lines (entering / leaving) -->
  <path d="M 240 230 Q 290 230 320 240" class="conn" stroke-dasharray="2 6"/>
  <path d="M 240 271 Q 290 271 320 240" class="conn" stroke-dasharray="2 6"/>
  <path d="M 240 311 Q 290 311 320 240" class="conn" stroke-dasharray="2 6"/>

  <!-- Main connections between nodes -->
  <path d="M 420 240 L 520 240" class="conn"/>
  <circle cx="468" cy="240" r="3" class="conn-dot"/>
  <path d="M 680 240 L 780 240" class="conn"/>
  <circle cx="728" cy="240" r="3" class="conn-dot"/>

  <!-- Exit connection -->
  <path d="M 880 240 Q 920 240 960 215" class="conn" stroke-dasharray="2 6"/>
  <path d="M 880 240 Q 920 240 960 255" class="conn" stroke-dasharray="2 6"/>

  <!-- Workflow nodes (3 boxes) -->
  <!-- Node 1: RSS Aggregator -->
  <g transform="translate(320, 195)">
    <rect width="100" height="90" rx="10" class="node-bg"/>
    <g transform="translate(50, 30)" class="ico" stroke="var(--brand-50)">
      <!-- Lucide rss icon -->
      <path d="M4 11a9 9 0 0 1 9 9"/>
      <path d="M4 4a16 16 0 0 1 16 16"/>
      <circle cx="5" cy="19" r="1"/>
    </g>
    <text x="50" y="78" font-size="11" text-anchor="middle" class="node-label" letter-spacing="1">RSS</text>
  </g>

  <!-- Node 2: DeepSeek IA (highlighted) -->
  <g transform="translate(520, 175)">
    <rect width="160" height="130" rx="12" class="node-bg-strong"/>
    <g transform="translate(72, 36)" class="ico" stroke="var(--brand-50)" stroke-width="2">
      <!-- Brain icon -->
      <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
      <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    </g>
    <text x="80" y="98" font-size="14" text-anchor="middle" class="node-label" letter-spacing="1.5">DEEPSEEK</text>
    <text x="80" y="115" font-size="10" text-anchor="middle" class="node-sub" letter-spacing="1">resume + score</text>
  </g>

  <!-- Node 3: Discord -->
  <g transform="translate(780, 195)">
    <rect width="100" height="90" rx="10" class="node-bg"/>
    <g transform="translate(50, 30)" class="ico" stroke="var(--brand-50)">
      <!-- Lucide message-square -->
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </g>
    <text x="50" y="78" font-size="11" text-anchor="middle" class="node-label" letter-spacing="1">DISCORD</text>
  </g>

  <!-- Tag pills -->
  <g transform="translate(0, 410)">
    <g transform="translate(450, 0)">
      <rect width="70" height="32" rx="16" class="pil"/>
      <text x="35" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">N8N</text>
    </g>
    <g transform="translate(535, 0)">
      <rect width="110" height="32" rx="16" class="pil"/>
      <text x="55" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">DEEPSEEK</text>
    </g>
    <g transform="translate(660, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">RSS</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="txt">n8n Veille Auto</text>

  <!-- Subtitle -->
  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="sub">VEILLE TECHNIQUE AUTOMATISÉE</tspan>
      <tspan class="mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="sub" dx="18">WORKFLOW IA</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · AUTOMATION</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
