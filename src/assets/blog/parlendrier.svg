<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .node   { fill: var(--brand-400); fill-opacity: 0.16; stroke: var(--brand-50); stroke-width: 2.5; }
    .wave   { stroke: var(--brand-50); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-opacity: 0.8; }
    .card-dot { fill: var(--brand-100); fill-opacity: 0.4; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Faint framing grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Micro (voix) -->
  <g transform="translate(430, 235)">
    <rect x="-22" y="-70" width="44" height="80" rx="22" class="node"/>
    <path d="M-36 -14 a36 36 0 0 0 72 0" class="ico"/>
    <path d="M0 46 v24 M-18 70 h36" class="ico"/>
  </g>

  <!-- Ondes sonores vers l'agenda (traitement local) -->
  <g class="wave">
    <path d="M498 205 a26 30 0 0 1 0 60"/>
    <path d="M524 195 a40 46 0 0 1 0 80"/>
    <path d="M550 187 a54 60 0 0 1 0 96"/>
  </g>

  <!-- Agenda (calendrier) -->
  <g transform="translate(720, 235)">
    <rect x="-70" y="-64" width="140" height="128" rx="12" class="node"/>
    <line x1="-70" y1="-32" x2="70" y2="-32" class="ico" stroke-opacity="0.6"/>
    <path d="M-46 -78 v20 M46 -78 v20" class="ico"/>
    <!-- grille de jours -->
    <g class="card-dot">
      <rect x="-54" y="-18" width="20" height="14" rx="3"/>
      <rect x="-26" y="-18" width="20" height="14" rx="3"/>
      <rect x="2" y="-18" width="20" height="14" rx="3"/>
      <rect x="30" y="-18" width="20" height="14" rx="3"/>
      <rect x="-54" y="4" width="20" height="14" rx="3"/>
      <rect x="-26" y="4" width="20" height="14" rx="3" fill-opacity="0.85"/>
      <rect x="2" y="4" width="20" height="14" rx="3"/>
      <rect x="30" y="4" width="20" height="14" rx="3"/>
      <rect x="-54" y="26" width="20" height="14" rx="3"/>
      <rect x="-26" y="26" width="20" height="14" rx="3"/>
    </g>
    <!-- evenement cree (surligne) -->
    <rect x="-26" y="4" width="20" height="14" rx="3" class="ico" fill="none"/>
  </g>

  <!-- Tag pills above title -->
  <g transform="translate(0, 380)">
    <g transform="translate(430, 0)">
      <rect width="110" height="32" rx="16" class="pil"/>
      <text x="55" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">FLUTTER</text>
    </g>
    <g transform="translate(555, 0)">
      <rect width="130" height="32" rx="16" class="pil"/>
      <text x="65" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">ON-DEVICE</text>
    </g>
    <g transform="translate(700, 0)">
      <rect width="70" height="32" rx="16" class="pil"/>
      <text x="35" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">VOIX</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="475" font-size="82" text-anchor="middle" letter-spacing="-2" class="txt">Parlendrier</text>

  <!-- Stats bar -->
  <g transform="translate(600, 525)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2">
      <tspan class="mono">HORS-LIGNE</tspan>
      <tspan class="mono" dx="18">·</tspan>
      <tspan class="mono" dx="18">SHERPA-ONNX</tspan>
      <tspan class="mono" dx="18">·</tspan>
      <tspan class="mono" dx="18">FR</tspan>
      <tspan class="sub" dx="6">DÉTERMINISTE</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · MOBILE IA</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
