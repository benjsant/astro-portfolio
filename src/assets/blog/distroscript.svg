<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .term-bg     { fill: var(--brand-400); fill-opacity: 0.22; stroke: var(--brand-100); stroke-opacity: 0.7; stroke-width: 2; }
    .term-bar    { fill: var(--brand-400); fill-opacity: 0.45; }
    .term-line   { fill: var(--brand-50); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; }
    .term-prompt { fill: var(--brand-200); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .term-comment { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 400; fill-opacity: 0.55; }
    .term-dot    { fill: var(--brand-50); }
    .container-card { fill: var(--brand-400); fill-opacity: 0.18; stroke: var(--brand-200); stroke-opacity: 0.35; stroke-width: 1.2; }
    .container-label { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.7; }
    .dot    { fill: var(--brand-200); }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>

  <!-- Dotted grid -->
  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Background container chips (left) -->
  <g transform="translate(70, 175)">
    <rect width="160" height="38" rx="8" class="container-card"/>
    <circle cx="20" cy="19" r="6" fill="var(--brand-100)" fill-opacity="0.4"/>
    <text x="36" y="23" font-size="12" class="container-label" letter-spacing="1">ubuntu_dev_py</text>
  </g>
  <g transform="translate(70, 225)">
    <rect width="160" height="38" rx="8" class="container-card"/>
    <circle cx="20" cy="19" r="6" fill="var(--brand-100)" fill-opacity="0.4"/>
    <text x="36" y="23" font-size="12" class="container-label" letter-spacing="1">ubuntu_dev_ia</text>
  </g>
  <g transform="translate(70, 275)">
    <rect width="160" height="38" rx="8" class="container-card"/>
    <circle cx="20" cy="19" r="6" fill="var(--brand-100)" fill-opacity="0.4"/>
    <text x="36" y="23" font-size="12" class="container-label" letter-spacing="1">fedora_gaming</text>
  </g>

  <!-- Background container chips (right) -->
  <g transform="translate(970, 200)">
    <rect width="160" height="38" rx="8" class="container-card"/>
    <circle cx="20" cy="19" r="6" fill="var(--brand-100)" fill-opacity="0.4"/>
    <text x="36" y="23" font-size="12" class="container-label" letter-spacing="1">podman · GPU</text>
  </g>
  <g transform="translate(970, 250)">
    <rect width="160" height="38" rx="8" class="container-card"/>
    <circle cx="20" cy="19" r="6" fill="var(--brand-100)" fill-opacity="0.4"/>
    <text x="36" y="23" font-size="12" class="container-label" letter-spacing="1">distrobox</text>
  </g>

  <!-- Center: terminal window -->
  <g transform="translate(330, 150)">
    <!-- Terminal frame -->
    <rect x="0" y="0" width="540" height="240" rx="12" class="term-bg"/>
    <!-- Top bar -->
    <rect x="0" y="0" width="540" height="32" rx="12" class="term-bar"/>
    <rect x="0" y="20" width="540" height="12" class="term-bar"/>
    <!-- macOS-style traffic lights -->
    <circle cx="18" cy="16" r="5" class="term-dot" fill-opacity="0.85"/>
    <circle cx="36" cy="16" r="5" class="term-dot" fill-opacity="0.6"/>
    <circle cx="54" cy="16" r="5" class="term-dot" fill-opacity="0.4"/>
    <!-- Title in bar -->
    <text x="270" y="21" font-size="12" text-anchor="middle" class="container-label" letter-spacing="2">distroscript ~/distrobox</text>

    <!-- Terminal lines -->
    <g transform="translate(24, 64)">
      <text x="0" y="0" font-size="15" class="term-prompt">$</text>
      <text x="22" y="0" font-size="15" class="term-line">./distroscript create ubuntu_dev_ia</text>
    </g>
    <g transform="translate(24, 96)">
      <text x="0" y="0" font-size="13" class="term-comment">→ detecting GPU... NVIDIA CUDA</text>
    </g>
    <g transform="translate(24, 122)">
      <text x="0" y="0" font-size="13" class="term-comment">→ pulling ubuntu:24.04</text>
    </g>
    <g transform="translate(24, 148)">
      <text x="0" y="0" font-size="13" class="term-comment">→ installing ollama + uv + pyenv</text>
    </g>
    <g transform="translate(24, 176)">
      <text x="0" y="0" font-size="13" class="term-comment">→ post-install check OK</text>
    </g>
    <g transform="translate(24, 208)">
      <text x="0" y="0" font-size="15" class="term-prompt">$</text>
      <text x="22" y="0" font-size="15" class="term-line">_</text>
      <rect x="34" y="-12" width="9" height="16" class="term-dot" fill-opacity="0.9"/>
    </g>
  </g>

  <!-- Tag pills -->
  <g transform="translate(0, 410)">
    <g transform="translate(440, 0)">
      <rect width="90" height="32" rx="16" class="pil"/>
      <text x="45" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">LINUX</text>
    </g>
    <g transform="translate(545, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">PODMAN</text>
    </g>
    <g transform="translate(660, 0)">
      <rect width="100" height="32" rx="16" class="pil"/>
      <text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">BASH</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="txt">DistroScript</text>

  <!-- Subtitle -->
  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="sub">ENVIRONNEMENTS LINUX ISOLÉS</tspan>
      <tspan class="mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="sub" dx="18">DISTROBOX</tspan>
    </text>
  </g>

  <!-- Top-left meta tag -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">PROJECT · DEVOPS</text>
  </g>

  <!-- Top-right status dots -->
  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
