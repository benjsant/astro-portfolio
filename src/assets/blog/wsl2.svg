<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .w-bg     { fill: oklch(58% 0.135 65); }
    .w-ico    { stroke: oklch(97% 0.025 85); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .w-txt    { fill: oklch(97% 0.025 85); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .w-sub    { fill: oklch(89% 0.075 80); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.9; }
    .w-mono   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .w-ln     { stroke: oklch(80% 0.115 75); stroke-width: 1; stroke-opacity: 0.3; }
    .w-pil    { fill: oklch(50% 0.125 60); fill-opacity: 0.5; stroke: oklch(89% 0.075 80); stroke-opacity: 0.6; stroke-width: 1; }
    .w-ptx    { fill: oklch(95% 0.04 80); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .w-cor    { stroke: oklch(80% 0.115 75); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .w-card        { fill: oklch(50% 0.125 60); fill-opacity: 0.25; stroke: oklch(89% 0.075 80); stroke-opacity: 0.35; stroke-width: 1; }
    .w-card-text   { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.75; }
    .w-os-box      { fill: oklch(50% 0.125 60); fill-opacity: 0.45; stroke: oklch(97% 0.025 85); stroke-opacity: 0.92; stroke-width: 2.4; }
    .w-os-label    { fill: oklch(97% 0.025 85); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .w-os-sub      { fill: oklch(89% 0.075 80); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; fill-opacity: 0.75; }
    .w-bridge-bg   { fill: oklch(50% 0.125 60); fill-opacity: 0.65; stroke: oklch(97% 0.025 85); stroke-opacity: 1; stroke-width: 2.4; }
    .w-bridge-txt  { fill: oklch(97% 0.025 85); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 900; }
    .w-flow        { stroke: oklch(97% 0.025 85); stroke-width: 2.5; fill: none; stroke-opacity: 0.85; stroke-linecap: round; stroke-dasharray: 4 6; }
    .w-dot         { fill: oklch(85% 0.135 75); }
  </style>

  <rect width="1200" height="630" class="w-bg"/>

  <g class="w-ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <!-- Left: Windows file paths -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-size="11" class="w-mono" letter-spacing="1" fill-opacity="0.6">C:\</text>
    <g transform="translate(0, 14)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="11" class="w-card-text" letter-spacing="0.5">C:\Users\dev</text></g>
    <g transform="translate(0, 50)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="11" class="w-card-text" letter-spacing="0.5">C:\Program Files</text></g>
    <g transform="translate(0, 86)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="11" class="w-card-text" letter-spacing="0.5">Hyper-V · VT-x</text></g>
  </g>

  <!-- Right: Linux paths -->
  <g transform="translate(960, 175)">
    <text x="0" y="0" font-size="11" class="w-mono" letter-spacing="1" fill-opacity="0.6">/</text>
    <g transform="translate(0, 14)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="11" class="w-card-text" letter-spacing="0.5">/home/user</text></g>
    <g transform="translate(0, 50)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="11" class="w-card-text" letter-spacing="0.5">/etc · /usr/bin</text></g>
    <g transform="translate(0, 86)"><rect width="180" height="28" rx="6" class="w-card"/><text x="14" y="19" font-size="11" class="w-card-text" letter-spacing="0.5">apt · dnf · pip</text></g>
  </g>

  <!-- Center composition: Windows box <—WSL2—> Linux box -->
  <g transform="translate(300, 175)">

    <!-- Windows side -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="160" rx="14" class="w-os-box"/>
      <!-- Window panes icon -->
      <g transform="translate(70, 30)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="2.2">
        <rect x="0"  y="0"  width="26" height="26" rx="3"/>
        <rect x="34" y="0"  width="26" height="26" rx="3"/>
        <rect x="0"  y="34" width="26" height="26" rx="3"/>
        <rect x="34" y="34" width="26" height="26" rx="3"/>
      </g>
      <text x="100" y="125" font-size="16" text-anchor="middle" class="w-os-label" letter-spacing="1.5">Windows</text>
      <text x="100" y="143" font-size="11" text-anchor="middle" class="w-os-sub" letter-spacing="1">host · NTFS</text>
    </g>

    <!-- WSL2 bridge -->
    <path d="M 205 80 L 245 80" class="w-flow"/>
    <g transform="translate(250, 50)">
      <rect x="0" y="0" width="100" height="60" rx="14" class="w-bridge-bg"/>
      <text x="50" y="28" font-size="22" text-anchor="middle" class="w-bridge-txt" letter-spacing="-1">WSL2</text>
      <text x="50" y="48" font-size="10" text-anchor="middle" class="w-os-sub" letter-spacing="1.5">Hyper-V VM</text>
    </g>
    <path d="M 355 80 L 395 80" class="w-flow"/>

    <!-- Linux side -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="200" height="160" rx="14" class="w-os-box"/>
      <!-- Terminal icon -->
      <g transform="translate(72, 30)" class="w-ico" stroke="oklch(97% 0.025 85)" stroke-width="2.2">
        <rect x="0" y="0" width="56" height="42" rx="4"/>
        <path d="M 10 14 L 18 22 L 10 30"/>
        <line x1="26" y1="30" x2="42" y2="30"/>
      </g>
      <text x="100" y="125" font-size="16" text-anchor="middle" class="w-os-label" letter-spacing="1.5">Linux</text>
      <text x="100" y="143" font-size="11" text-anchor="middle" class="w-os-sub" letter-spacing="1">guest · Ubuntu</text>
    </g>

  </g>

  <g transform="translate(0, 410)">
    <g transform="translate(450, 0)"><rect width="80" height="32" rx="16" class="w-pil"/><text x="40" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">WSL2</text></g>
    <g transform="translate(545, 0)"><rect width="100" height="32" rx="16" class="w-pil"/><text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">WINDOWS</text></g>
    <g transform="translate(660, 0)"><rect width="80" height="32" rx="16" class="w-pil"/><text x="40" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="w-ptx">LINUX</text></g>
  </g>

  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="w-txt">WSL2</text>

  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="w-mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="w-sub">LINUX DANS WINDOWS SANS DUAL BOOT</tspan>
      <tspan class="w-mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="w-sub" dx="18">GUIDE</tspan>
    </text>
  </g>

  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="w-dot"/>
    <text x="14" y="5" font-size="14" class="w-mono" letter-spacing="2">GUIDE · DEV ENV</text>
  </g>

  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="w-dot"/>
    <circle cx="14" cy="0" r="4" class="w-dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="w-dot" fill-opacity="0.3"/>
  </g>

  <path d="M 36 60 L 36 36 L 60 36" class="w-cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="w-cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="w-cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="w-cor"/>
</svg>
