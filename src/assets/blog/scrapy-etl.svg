<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg     { fill: var(--brand-500); }
    .ico    { stroke: var(--brand-50);  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt    { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 500; fill-opacity: 0.85; }
    .mono   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
    .ln     { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.3; }
    .pil    { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-200); stroke-opacity: 0.5; stroke-width: 1; }
    .ptx    { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 600; }
    .cor    { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }
    .source-card { fill: var(--brand-400); fill-opacity: 0.28; stroke: var(--brand-100); stroke-opacity: 0.85; stroke-width: 2; }
    .source-label { fill: var(--brand-50); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
    .source-sub   { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; fill-opacity: 0.7; }
    .db-cylinder-top  { fill: var(--brand-400); fill-opacity: 0.6; stroke: var(--brand-100); stroke-opacity: 0.95; stroke-width: 2; }
    .db-cylinder-body { fill: var(--brand-400); fill-opacity: 0.35; stroke: var(--brand-100); stroke-opacity: 0.85; stroke-width: 2; }
    .db-cylinder-band { stroke: var(--brand-100); stroke-opacity: 0.5; stroke-width: 1.3; fill: none; }
    .arrow { stroke: var(--brand-50); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.85; }
    .data-row { fill: var(--brand-400); fill-opacity: 0.22; stroke: var(--brand-200); stroke-opacity: 0.35; stroke-width: 1; }
    .data-text { fill: var(--brand-100); font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; fill-opacity: 0.65; }
    .dot    { fill: var(--brand-200); }
  </style>

  <rect width="1200" height="630" class="bg"/>

  <g class="ln">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 14"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="2 14"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke-dasharray="2 14"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke-dasharray="2 14"/>
  </g>

  <g transform="translate(60, 175)">
    <text x="0" y="0" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.55">RAW INPUT</text>
    <g transform="translate(0, 14)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">id,name,type1</text></g>
    <g transform="translate(0, 42)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">001,bulbasaur,grass</text></g>
    <g transform="translate(0, 70)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">004,charmander,fire</text></g>
    <g transform="translate(0, 98)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">025,pikachu,electric</text></g>
  </g>

  <g transform="translate(960, 175)">
    <text x="0" y="0" font-size="11" class="mono" letter-spacing="1" fill-opacity="0.55">TABLES</text>
    <g transform="translate(0, 14)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">pokemon</text></g>
    <g transform="translate(0, 42)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">moves</text></g>
    <g transform="translate(0, 70)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">types</text></g>
    <g transform="translate(0, 98)"><rect width="180" height="22" rx="4" class="data-row"/><text x="8" y="15" font-size="11" class="data-text" letter-spacing="0.5">evolutions</text></g>
  </g>

  <!-- 3 source cards -->
  <g transform="translate(260, 165)">
    <rect width="130" height="60" rx="10" class="source-card"/>
    <g transform="translate(16, 14)" class="ico" stroke="var(--brand-50)" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/>
    </g>
    <text x="56" y="30" font-size="14" class="source-label" letter-spacing="1">CSV</text>
    <text x="56" y="46" font-size="10" class="source-sub" letter-spacing="1">base file</text>
  </g>
  <g transform="translate(260, 235)">
    <rect width="130" height="60" rx="10" class="source-card"/>
    <g transform="translate(16, 14)" class="ico" stroke="var(--brand-50)" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20"/>
      <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>
    </g>
    <text x="56" y="30" font-size="14" class="source-label" letter-spacing="1">PokéAPI</text>
    <text x="56" y="46" font-size="10" class="source-sub" letter-spacing="1">enrichment</text>
  </g>
  <g transform="translate(260, 305)">
    <rect width="130" height="60" rx="10" class="source-card"/>
    <g transform="translate(16, 14)" class="ico" stroke="var(--brand-50)" stroke-width="2">
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <path d="M3 12h18"/>
      <path d="M19 12c0 5-3 9-7 9s-7-4-7-9"/>
    </g>
    <text x="56" y="30" font-size="14" class="source-label" letter-spacing="1">Scrapy</text>
    <text x="56" y="46" font-size="10" class="source-sub" letter-spacing="1">Pokepédia</text>
  </g>

  <path d="M 390 195 Q 470 195 540 250" class="arrow"/>
  <path d="M 390 265 L 540 265" class="arrow"/>
  <path d="M 390 335 Q 470 335 540 280" class="arrow"/>

  <g transform="translate(540, 230)">
    <rect width="160" height="80" rx="12" class="source-card" fill-opacity="0.45"/>
    <g transform="translate(60, 16)" class="ico" stroke="var(--brand-50)" stroke-width="2">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.92.99 6.69 2.81L21 8"/>
      <polyline points="21 3 21 8 16 8"/>
    </g>
    <text x="80" y="58" font-size="14" text-anchor="middle" class="source-label" letter-spacing="1.5">ETL</text>
    <text x="80" y="73" font-size="10" text-anchor="middle" class="source-sub" letter-spacing="1">extract · transform · load</text>
  </g>

  <path d="M 700 270 L 760 270 M 755 265 L 760 270 L 755 275" class="arrow"/>

  <g transform="translate(770, 195)">
    <path d="M 0 18 L 0 130 Q 0 148 60 148 Q 120 148 120 130 L 120 18 Z" class="db-cylinder-body"/>
    <ellipse cx="60" cy="18" rx="60" ry="18" class="db-cylinder-top"/>
    <ellipse cx="60" cy="52" rx="60" ry="14" class="db-cylinder-band"/>
    <ellipse cx="60" cy="86" rx="60" ry="14" class="db-cylinder-band"/>
    <ellipse cx="60" cy="120" rx="60" ry="14" class="db-cylinder-band"/>
    <text x="60" y="170" font-size="13" text-anchor="middle" class="source-label" letter-spacing="1.5">PostgreSQL</text>
  </g>

  <g transform="translate(0, 410)">
    <g transform="translate(450, 0)"><rect width="90" height="32" rx="16" class="pil"/><text x="45" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">SCRAPY</text></g>
    <g transform="translate(555, 0)"><rect width="100" height="32" rx="16" class="pil"/><text x="50" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">FASTAPI</text></g>
    <g transform="translate(670, 0)"><rect width="70" height="32" rx="16" class="pil"/><text x="35" y="21" font-size="13" text-anchor="middle" letter-spacing="1.5" class="ptx">ETL</text></g>
  </g>

  <text x="600" y="490" font-size="92" text-anchor="middle" letter-spacing="-3" class="txt">ETL Pipeline</text>

  <g transform="translate(600, 535)" text-anchor="middle">
    <text x="0" y="0" font-size="18" class="mono" letter-spacing="2" fill-opacity="0.85">
      <tspan class="sub">EXTRACTION MULTI-SOURCES</tspan>
      <tspan class="mono" dx="18" fill-opacity="0.6">·</tspan>
      <tspan class="sub" dx="18">POSTGRESQL</tspan>
    </text>
  </g>

  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <text x="14" y="5" font-size="14" class="mono" letter-spacing="2">ARTICLE · DATA ENGINEERING</text>
  </g>

  <g transform="translate(1100, 80)">
    <circle cx="0" cy="0" r="4" class="dot"/>
    <circle cx="14" cy="0" r="4" class="dot" fill-opacity="0.6"/>
    <circle cx="28" cy="0" r="4" class="dot" fill-opacity="0.3"/>
  </g>

  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
