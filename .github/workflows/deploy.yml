name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit des dépendances de production (ce qui ship réellement).
      # Non bloquant : la plupart des alertes viennent de chaînes build-time
      # (ex. astro-icon > @iconify/tools > cheerio > undici) qui ne sont pas
      # expédiées au navigateur. On veut la visibilité, pas un CI rouge en
      # permanence sur des transitives non corrigeables sans mise à jour amont.
      - name: Audit dependencies (report only)
        run: pnpm audit --prod
        continue-on-error: true

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
